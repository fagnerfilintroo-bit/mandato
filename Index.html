<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mandato</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: mesa de comando. Cabeçalho fino, mapa/painéis em coluna única, navegação inferior fixa, botão "Encerrar ano" flutuante. */
:root{
  --bg:#0c171d; --bg2:#12232b; --surf:#173039; --line:#2b4650;
  --fg:#e9f0ec; --mute:#93a9a8; --gold:#e3ab3c; --red:#d95a43; --green:#58b88a; --blue:#4f9bc9;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:400 15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 150px}
#app{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h2{font-size:22px;color:var(--gold);margin:22px 0 8px}
h3{font-size:17px;margin:14px 0 6px}
p{margin:0 0 8px}
.mute{color:var(--mute)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
button{font:600 14px var(--body);color:var(--fg);background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer;min-height:40px}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.pri{background:var(--gold);color:#1a1405;border-color:var(--gold)}
button.bad{border-color:var(--red);color:#ffb3a3}
button.ok{border-color:var(--green);color:#a8e6c6}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0}
.panel.hi{border-color:var(--gold)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .t1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.12em;color:var(--gold)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;font-family:var(--mono);color:var(--mute);white-space:nowrap}
.chip.g{color:var(--green);border-color:var(--green)} .chip.r{color:#ffb3a3;border-color:var(--red)} .chip.y{color:var(--gold);border-color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px;margin-top:8px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.kpi b{display:block;font:600 16px var(--mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.kpi i{font:400 11px var(--mono);font-style:normal}
.up{color:var(--green)} .dn{color:var(--red)}
.bar{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--gold)}
.bar.g>div{background:var(--green)} .bar.r>div{background:var(--red)} .bar.b>div{background:var(--blue)}
.meter{display:grid;grid-template-columns:96px 1fr 38px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
nav.bottom div{display:flex;gap:4px;max-width:760px;width:100%;overflow-x:auto}
nav.bottom button{flex:1 0 auto;min-width:0;padding:8px 9px;font-size:10px;border:none;background:transparent;color:var(--mute);border-radius:6px;min-height:44px}
nav.bottom button.on{background:var(--surf);color:var(--gold)}
.endyear{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:26;
  font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;border-radius:99px;box-shadow:0 6px 20px #000a}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pills button{padding:5px 11px;min-height:32px;border-radius:99px;font-size:13px}
.pills button.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
svg{display:block;max-width:100%;height:auto}
.mapwrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0a1419}
.region{cursor:pointer;stroke:#0a1419;stroke-width:2;transition:filter .15s}
.region:hover{filter:brightness(1.25)}
.region.alert{stroke:#d95a43;stroke-width:3;stroke-dasharray:6 4;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.25}}
.region.sel{stroke:var(--gold);stroke-width:3}
input[type=range]{width:100%;accent-color:var(--gold);min-height:32px}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;font-size:13px;min-height:40px;max-width:100%}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:10px;font:400 16px var(--body);resize:vertical;margin:4px 0}
input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:10px;font:400 16px var(--body)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.card{background:var(--bg2);border:2px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block;color:var(--fg);font:inherit}
.card .body{padding:10px 12px}
.card.on{border-color:var(--gold)}
.card h3{margin:0 0 4px;color:var(--gold)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid var(--bg);padding:0;min-height:40px}
.swatch.on{border-color:var(--fg)}
.tag{display:inline-block;font:600 11px var(--mono);padding:1px 7px;border-radius:4px;background:var(--surf);color:var(--mute);margin-right:4px}
.seats{display:flex;height:22px;border-radius:4px;overflow:hidden;border:1px solid var(--line);margin:6px 0}
.seats>div{display:flex;align-items:center;justify-content:center;font:600 11px var(--mono);color:#0c171d;min-width:0;overflow:hidden}
.party{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.modal{position:fixed;inset:0;z-index:50;background:#000c;display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal>div{background:var(--bg2);border:1px solid var(--gold);border-radius:10px;max-width:560px;width:100%;max-height:100%;overflow:auto}
.modal .body{padding:14px}
@media(min-width:620px){.modal{align-items:center}}
.log p{border-left:3px solid var(--line);padding-left:10px;margin:0 0 8px}
.log p.e{border-color:var(--gold)} .log p.bad{border-color:var(--red)} .log p.good{border-color:var(--green)}
.hero{border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:10px 0}
.title{font-size:44px;line-height:.95;margin:18px 0 6px}
.post{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.35}
.post:first-child{border-top:0}.post.ad{background:rgba(227,171,60,.07);border-radius:6px;padding:8px}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#10181c;font-weight:700;font-size:12px}
.live{position:fixed;left:8px;right:8px;bottom:68px;z-index:40;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:520px;margin:0 auto}
.live>div{background:rgba(14,24,30,.96);border:1px solid var(--gold);border-radius:10px;padding:0 10px;box-shadow:0 6px 20px rgba(0,0,0,.5);animation:liveOut 9s linear forwards}
.live .post{border:0;padding:8px 0}
@keyframes liveOut{0%{opacity:0;transform:translateY(10px)}4%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0;visibility:hidden}}
.bar.r>div{background:var(--red)}.bar.g>div{background:var(--green)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0c171d"><script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script>

<div id="app"></div><script>
// ===== Utilidades =====
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const f0=n=>Math.round(n).toLocaleString('pt-BR');
const f1=n=>(Math.round(n*10)/10).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const sg=(n,d=1)=>(n>=0?'+':'')+(d?f1(n):f0(n));

// ===== Regimes =====
const REGIMES={
  parlamentarismo:{nome:'Parlamentarismo',lema:'Governa quem tem maioria.',desc:'Você é o primeiro-ministro. Precisa de uma coalizão de 51 cadeiras. Eleições a cada 4 anos e voto de desconfiança.',elec:4,need:51,decree:false,veto:true,
    regras:['Eleição de NPCs a cada 4 anos','Coalizão precisa de 51+ cadeiras','Sem maioria: voto de desconfiança e eleição antecipada']},
